  # source: microservice-di-options-extensions
  dotnet-di-options-extension-methods:
    applies_to:
      - "**/*.cs"
    aliases:
      - dependency-injection
      - IServiceCollection
      - extension-methods
    strong_terms:
      - AddOptions
      - Bind
      - ValidateOnStart
      - IServiceCollection
      - IOptions
      - IOptionsSnapshot
      - IOptionsMonitor
