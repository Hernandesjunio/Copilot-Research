version: 1
namespace: dotnet
description: "Expansões relacionadas a .NET, C#, ASP.NET Core e práticas da stack."

terms:
  # source: csharp-async-style
  csharp-async-naming-style:
    applies_to:
      - "**/*.cs"
    aliases:
      - async-style
      - "Async suffix"
    strong_terms:
      - async
      - await
      - "Async"
      - async-void
    weak_terms:
      - ConfigureAwait
      - ConfigureAwait(false)
    expansion_mode: normal

  # source: microservice-testing-strategy-unit-integration-contract
  dotnet-testing-unit-integration-contract:
    applies_to:
      - "**/*Tests/**/*.cs"
    aliases:
      - testing-strategy
      - unit-testing
      - integration-testing
      - contract-testing
    strong_terms:
      - xUnit
      - Fact
      - WebApplicationFactory
      - Testcontainers
      - Pact
    weak_terms:
      - negative-tests
      - toxiproxy
      - "400"
      - "422"
      - "403"
    expansion_mode: normal

  # source: microservice-configuration-production-readiness
  dotnet-options-validateonstart-featureflags:
    applies_to:
      - "**/*.cs"
    aliases:
      - configuration
      - options
      - production-readiness
      - feature-flags
    strong_terms:
      - IOptions
      - ValidateOnStart
      - ValidateDataAnnotations
      - IConfiguration
      - AddFeatureManagement
      - IFeatureManager
      - fail-fast
    weak_terms:
      - appsettings
      - environment-variables
      - KeyVault
    expansion_mode: normal

  # source: dns-retry-pattern
  dns-retry-backoff-jitter:
    applies_to:
      - "**/*.cs"
    aliases:
      - dns-retry
      - dns-resolution
    strong_terms:
      - exponential-backoff
      - jitter
      - polly
    weak_terms:
      - CorrelationId
      - async
    expansion_mode: normal

  # source: microservice-resilience-polly-timeouts-and-circuit-breaker
  polly-timeouts-retry-circuit-breaker:
    applies_to:
      - "**/*.cs"
    aliases:
      - polly
      - resilience
      - circuit-breaker
    strong_terms:
      - timeout
      - retry
      - backoff
      - jitter
      - AddPolicyHandler
      - HttpPolicyExtensions
      - IAsyncPolicy
    weak_terms:
      - "429"
      - Retry-After
      - bulkhead
    expansion_mode: normal

  # source: microservice-caching-imemorycache-policy
  imemorycache-ttl-invalidation-multitenant:
    applies_to:
      - "**/*.cs"
    aliases:
      - IMemoryCache
