version: 1
namespace: messaging
description: "Expansões relacionadas a mensageria, filas, eventos e integração assíncrona."

terms:
  mensageria:
    aliases:
      - messaging
    strong_terms:
      - publish
      - consume
      - outbox
    weak_terms:
      - event
    expansion_mode: contextual
    contexts:
      rabbitmq:
        activation_terms:
          - rabbitmq
          - amqp
          - exchange
          - consumer
        applies_to:
          - "**/*.cs"
        terms:
          - rabbitmq
          - exchange
          - queue
          - consumer
          - dlq

      fix:
        activation_terms:
          - fix-protocol
          - heartbeat
          - session
        applies_to:
          - "**/*.cs"
        terms:
          - fix
          - session
          - heartbeat

  # source: microservice-messaging-rabbitmq-publish-consume
  rabbitmq-idempotency-dlq-outbox:
    applies_to:
      - "**/*.cs"
    aliases:
      - rabbitmq
      - amqp
      - dead-letter
      - dlq
    strong_terms:
      - ack
      - nack
      - requeue
      - poison-message
      - messageId
      - outbox
      - BasicPublish
      - BasicConsume
    weak_terms:
      - BasicQos
      - traceparent
      - consumer
      - exchange
      - queue
    expansion_mode: normal

  # source: microservice-saga-process-manager-and-compensation
  saga-process-manager-compensation:
    applies_to:
      - "**/*.cs"
    aliases:
      - saga
      - process-manager
      - orchestration
    strong_terms:
      - eventual-consistency
      - compensation
      - correlationId
      - idempotency
      - outbox
      - state-machine
    weak_terms:
      - timeout
      - retry
      - cancelafter
    expansion_mode: normal
