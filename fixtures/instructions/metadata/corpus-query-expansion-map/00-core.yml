version: 1
namespace: core
description: "Termos transversais presentes em múltiplos domínios do corpus."

terms:
  resiliencia:
    aliases:
      - resilience
    strong_terms:
      - retry
      - circuit-breaker
      - timeout
      - polly
    weak_terms:
      - tolerancia
    expansion_mode: normal

  cache:
    aliases:
      - caching
    strong_terms:
      - imemorycache
      - idistributedcache
      - ttl
    weak_terms:
      - invalidation
    expansion_mode: normal

  validacao:
    aliases:
      - validation
    strong_terms:
      - error-contracts
      - problem-details
      - "422"
      - "400"
    weak_terms:
      - rfc7807
    expansion_mode: normal

  arquitetura:
    aliases:
      - architecture
    strong_terms:
      - layering
      - camadas
      - clean-architecture
      - solid
    weak_terms:
      - dominio
    expansion_mode: normal

  # source: artifact-encoding-line-endings-and-unicode
  encoding-texto:
    applies_to:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.json"
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sh"
      - "**/*.ps1"
      - "**/*.bat"
      - "**/*.txt"
    aliases:
      - encoding
      - charset
      - "fim de linha"
      - "end of line"
      - "line endings"
      - eol
    strong_terms:
      - "utf-8"
      - utf8
      - unicode
      - bom
      - "sem bom"
      - lf
      - crlf
      - editorconfig
      - gitattributes
      - interoperabilidade
    weak_terms: []
    expansion_mode: normal
