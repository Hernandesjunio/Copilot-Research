# Mesclado de 40-messaging.yml (contextos como lista ADR-002)
domain: messaging
version: "1"
entries:
  - canonical: mensageria
    aliases:
      - messaging
    strong_terms:
      - rabbitmq
      - publish
      - consume
      - outbox
    weak_terms:
      - event
    contexts:
      - activation_terms:
          - rabbitmq
          - amqp
          - exchange
          - consumer
        applies_to:
          - "**/*.cs"
        terms:
          - rabbitmq
          - exchange
          - queue
          - consumer
          - dlq
      - activation_terms:
          - fix-protocol
          - heartbeat
          - session
        applies_to:
          - "**/*.cs"
        terms:
          - fix
          - session
          - heartbeat

  - canonical: rabbitmq-idempotency-dlq-outbox
    applies_to:
      - "**/*.cs"
    aliases:
      - rabbitmq
      - amqp
      - dead-letter
      - dlq
    strong_terms:
      - ack
      - nack
      - requeue
      - poison-message
      - messageId
      - outbox
      - BasicPublish
      - BasicConsume
    weak_terms:
      - BasicQos
      - traceparent
      - consumer
      - exchange
      - queue
    contexts: []

  - canonical: saga-process-manager-compensation
    applies_to:
      - "**/*.cs"
    aliases:
      - saga
      - process-manager
      - orchestration
    strong_terms:
      - eventual-consistency
      - compensation
      - correlationId
      - idempotency
      - outbox
      - state-machine
    weak_terms:
      - timeout
      - retry
      - cancelafter
    contexts: []
