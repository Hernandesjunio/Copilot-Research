version: 1
namespace: api
description: "Expansões relacionadas a APIs e contratos HTTP."

terms:
  # source: microservice-api-error-catalog-baseline
  api-error-catalog:
    applies_to:
      - "**/Api/**/*.cs"
    aliases:
      - error-catalog
      - "http status catalog"
      - "status code catalog"
      - catalogo-erros-api
      - catalogo-de-erros
      - tabela-status-http
    strong_terms:
      - status-codes
      - "400"
      - "422"
      - problem-details
      - error-contracts
    weak_terms: []
    expansion_mode: normal

  # source: microservice-api-collection-resources-pagination-filters
  api-pagination-filters-sorting:
    applies_to:
      - "**/Api/**/*.cs"
    aliases:
      - pagination
      - filtering
      - sorting
      - pageSize
      - nextCursor
    strong_terms:
      - cursor
      - "page"
      - "pageSize"
      - sort
      - filters
      - backward-compatibility
      - versioning
    weak_terms:
      - whitelist
      - stable-ordering
    expansion_mode: normal

  # source: microservice-api-openfinance-patterns
  api-response-envelope-problemdetails:
    applies_to:
      - "**/Api/**/*.cs"
    aliases:
      - response-envelope
      - envelope
      - rfc7807
      - ProblemDetails
    strong_terms:
      - global-error-handling
      - middleware
      - exception-mapping
      - xml-docs
      - openapi
    weak_terms:
      - minimal-api
      - "traceId"
      - correlationId
    expansion_mode: normal

  # source: microservice-api-validation-and-error-contracts
  api-400-422-validation-and-error-contracts:
    applies_to:
      - "**/Api/**/*.cs"
    aliases:
      - "400"
      - "422"
      - error-contracts
      - problem-details
    strong_terms:
      - Status400BadRequest
      - Status422UnprocessableEntity
      - business-rule-exception
      - domain-exception-mapping
    weak_terms:
      - "409"
      - "412"
    expansion_mode: normal

  # source: microservice-rest-http-semantics-and-status-codes
  rest-http-semantics-and-status-codes:
    applies_to:
      - "**/Api/**/*.cs"
    aliases:
      - rest
      - http-semantics
      - status-codes
    strong_terms:
      - idempotency
      - "201"
      - "202"
      - "204"
      - "404"
      - "409"
      - "412"
      - "415"
      - "429"
    weak_terms:
      - Idempotency-Key
      - Location
    expansion_mode: normal
