      - "**/*.cs"
    aliases:
      - sql-security
      - data-access
      - dapper
      - efcore
    strong_terms:
      - sql-injection
      - parameterization
      - CommandDefinition
      - commandTimeout
      - IDbConnection
      - DbContext
