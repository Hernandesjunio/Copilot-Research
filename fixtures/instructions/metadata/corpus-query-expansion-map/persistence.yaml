      - dapper
      - sql
      - data
      - data-access
      - repositorio
    weak_terms: []
    contexts: []

  - canonical: banco
    aliases: []
    strong_terms:
      - sql
      - dapper
      - efcore
    weak_terms:
      - transactions
    contexts: []

  - canonical: transacao
    aliases:
      - transactions
    strong_terms:
      - configuracao
      - configuration
    weak_terms:
      - readiness
      - producao
    contexts: []

  - canonical: queries
    aliases: []
