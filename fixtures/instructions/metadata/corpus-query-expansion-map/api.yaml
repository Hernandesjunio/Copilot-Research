# Mesclado de 20-api.yml (contratos HTTP / REST)
domain: api
version: "1"
entries:
  - canonical: baseline
    aliases: []
    strong_terms:
      - error-catalog
    weak_terms: []
    contexts: []

  - canonical: api
    aliases: []
    strong_terms:
      - problem-details
      - rfc7807
      - pagination
    weak_terms:
      - minimal-api
      - filtering
    contexts: []

  - canonical: paginacao
    aliases:
      - pagination
    strong_terms:
      - filtering
      - ordering
      - collection
    weak_terms:
      - envelope
    contexts: []

  - canonical: colecoes
    aliases:
      - collection
    strong_terms:
      - pagination
      - filtering
      - ordering
    weak_terms:
      - api-collection
    contexts: []

  - canonical: problemdetails
    aliases:
      - problem-details
    strong_terms:
      - rfc7807
      - error-catalog
      - errors
    weak_terms:
      - status-codes
    contexts: []

  # --- origem 20-api.yml ---
  - canonical: api-error-catalog
    applies_to:
      - "**/Api/**/*.cs"
    aliases:
      - error-catalog
      - "http status catalog"
      - "status code catalog"
      - catalogo-erros-api
      - catalogo-de-erros
      - tabela-status-http
    strong_terms:
      - status-codes
      - "400"
      - "422"
      - problem-details
      - error-contracts
    weak_terms: []
    contexts: []

  - canonical: api-pagination-filters-sorting
    applies_to:
      - "**/Api/**/*.cs"
    aliases:
      - pagination
      - filtering
      - sorting
      - pageSize
      - nextCursor
    strong_terms:
      - cursor
      - "page"
      - pageSize
      - sort
      - filters
      - backward-compatibility
      - versioning
    weak_terms:
      - whitelist
      - stable-ordering
    contexts: []

  - canonical: api-response-envelope-problemdetails
    applies_to:
      - "**/Api/**/*.cs"
    aliases:
      - response-envelope
      - envelope
      - rfc7807
      - ProblemDetails
    strong_terms:
      - global-error-handling
      - middleware
      - exception-mapping
      - xml-docs
      - openapi
    weak_terms:
      - minimal-api
      - "traceId"
      - correlationId
    contexts: []

  - canonical: api-400-422-validation-and-error-contracts
    applies_to:
      - "**/Api/**/*.cs"
    aliases:
      - "400"
      - "422"
      - error-contracts
      - problem-details
    strong_terms:
      - Status400BadRequest
      - Status422UnprocessableEntity
      - business-rule-exception
      - domain-exception-mapping
    weak_terms:
      - "409"
      - "412"
    contexts: []

  - canonical: rest-http-semantics-and-status-codes
    applies_to:
      - "**/Api/**/*.cs"
    aliases:
      - rest
      - http-semantics
      - status-codes
    strong_terms:
      - idempotency
      - "201"
      - "202"
      - "204"
      - "404"
      - "409"
      - "412"
      - "415"
      - "429"
    weak_terms:
      - Idempotency-Key
      - Location
    contexts: []
